# Render Blueprint – Infrastructure as Code for Sentinel AI
# https://docs.render.com/infrastructure-as-code
#
# One-click deploy:
#   1. Push this file to your repo
#   2. Go to https://dashboard.render.com/select-repo?type=blueprint
#   3. Select your repo → Render reads this file and provisions everything
# ============================================================================

databases:
  - name: sentinel-ai-db
    plan: free
    databaseName: sentinel_ai
    user: sentinel
    region: oregon

services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: sentinel-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        fromService:
          type: web
          name: sentinel-ai-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LOG_LEVEL
        value: INFO

  # ── Frontend (React + Vite) ──────────────────────────────────────────────
  - type: web
    name: sentinel-ai-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sentinel-ai-backend
          envVarKey: RENDER_EXTERNAL_URL
