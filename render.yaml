# ============================================================================
# Render Blueprint – Infrastructure as Code for Sentinel AI
# https://docs.render.com/infrastructure-as-code
#
# Single-service deploy: FastAPI serves both the API and the React frontend.
#
# One-click deploy:
#   1. Push this file to your repo
#   2. Go to https://dashboard.render.com/select-repo?type=blueprint
#   3. Select your repo → Render reads this file and provisions everything
# ============================================================================

databases:
  - name: sentinel-ai-db
    plan: free
    databaseName: sentinel_ai
    user: sentinel
    region: oregon

services:
  - type: web
    name: sentinel-ai
    runtime: python
    region: oregon
    plan: free
    # No rootDir — we need access to both backend/ and frontend/
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && python render_start.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: ""
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: VITE_API_BASE_URL
        value: /api/v1
