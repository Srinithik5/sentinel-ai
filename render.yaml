# ============================================================================
# Render Blueprint – Single-Service Deployment for Sentinel AI
# https://docs.render.com/infrastructure-as-code
#
# Single-service deploy using Docker multi-stage build:
# Node 20 builds the React frontend, Python 3.12 runs FastAPI + serves frontend assets.
# ============================================================================

databases:
  - name: sentinel-ai-db
    plan: free
    databaseName: sentinel_ai
    user: sentinel
    region: oregon

services:
  - type: web
    name: sentinel-ai
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
